<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Door Lock Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    /* Force browser calendar picker icon to be bright white on dark inputs */
    ::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex justify-center">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-xl shadow-2xl my-auto">
    <h1 class="text-2xl font-bold text-center text-emerald-400 mb-1">🚪 Door Lock Tracker</h1>
    <p class="text-xs text-slate-400 text-center uppercase tracking-wider mb-5">Tap sub-door to log lock timestamp</p>
    
    <!-- User Name Input (Required) -->
    <div class="mb-5">
      <label for="user-name" class="block text-xs font-medium text-slate-300 mb-1">
        Your Name <span class="text-rose-500 font-bold">* (Required)</span>
      </label>
      <input type="text" id="user-name" placeholder="Enter your name to proceed..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition" />
    </div>

    <!-- Terminal Switcher Tabs -->
    <div class="flex bg-slate-950 p-1.5 rounded-xl border border-slate-800 mb-6">
      <button id="tab-T2" onclick="switchTerminal('T2')" class="flex-1 py-2 rounded-lg font-bold text-sm transition bg-emerald-600 text-white shadow">
        Terminal 2
      </button>
      <button id="tab-T3" onclick="switchTerminal('T3')" class="flex-1 py-2 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white">
        Terminal 3
      </button>
    </div>

    <!-- Door Grid -->
    <div id="door-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 mb-6">
      <!-- Generated via JS -->
    </div>

    <!-- Real-Time Activity Log & Controls -->
    <div class="border-t border-slate-800 pt-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-slate-300">📜 Lock History</span>
          <span id="active-term-label" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">Terminal 2</span>
        </div>
        
        <!-- Date Selector & Export Button -->
        <div class="flex items-center gap-2 flex-wrap">
          <div class="relative flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 focus-within:border-emerald-500">
            <span class="mr-1.5 text-xs text-slate-400">📅</span>
            <input type="date" id="history-date" onchange="fetchHistoryForSelectedDate()" onclick="this.showPicker && this.showPicker()" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer" />
          </div>

          <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition active:scale-95 flex items-center gap-1 cursor-pointer shadow-md">
            📥 CSV
          </button>
        </div>
      </div>

      <div id="history-log" class="space-y-1.5 max-h-64 overflow-y-auto text-xs pr-1">
        <div class="text-slate-500 italic">Loading activity history...</div>
      </div>
    </div>

    <!-- Error / Warning Box -->
    <div id="error-box" class="mt-4 p-3 bg-red-950/80 border border-red-800 text-red-300 text-xs rounded-lg hidden"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQ5_TI3e84CM0IKsOZIcqZM-MAv92jN6U",
      authDomain: "door-check-78157.firebaseapp.com",
      projectId: "door-check-78157",
      storageBucket: "door-check-78157.firebasestorage.app",
      messagingSenderId: "210863643705",
      databaseURL: "https://door-check-78157-default-rtdb.asia-southeast1.firebasedatabase.app/",
      appId: "1:210863643705:web:ce56f4c4ae9576ca00c1e8",
      measurementId: "G-C08XS1REV8"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch (e) {
      showError("Firebase Init Error: " + e.message);
    }

    const db = firebase.database();

    const doorsData = {
      T2: ["1A", "1B", "2", "3", "4A", "4B", "4C", "4D", "5", "6A", "6B", "7", "8"],
      T3: ["1", "2", "3", "4", "5"]
    };

    let activeTerminal = "T2";
    let currentFetchedLogs = [];

    // Set Date Input to Today by Default (YYYY-MM-DD)
    const todayISO = new Date().toISOString().split('T')[0];
    document.getElementById('history-date').value = todayISO;

    function switchTerminal(term) {
      activeTerminal = term;
      
      document.getElementById('tab-T2').className = term === 'T2' 
        ? "flex-1 py-2 rounded-lg font-bold text-sm transition bg-emerald-600 text-white shadow"
        : "flex-1 py-2 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white";
      
      document.getElementById('tab-T3').className = term === 'T3' 
        ? "flex-1 py-2 rounded-lg font-bold text-sm transition bg-emerald-600 text-white shadow"
        : "flex-1 py-2 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white";

      document.getElementById('active-term-label').innerText = term === 'T2' ? "Terminal 2" : "Terminal 3";

      renderGrid();
      fetchHistoryForSelectedDate();
    }

    function renderGrid() {
      const grid = document.getElementById('door-grid');
      grid.innerHTML = "";

      doorsData[activeTerminal].forEach(subDoor => {
        const btn = document.createElement('button');
        btn.id = `btn-${activeTerminal}-${subDoor}`;
        btn.onclick = () => recordLock(subDoor);
        btn.className = "p-3 rounded-xl bg-slate-800 border border-slate-700/50 text-slate-300 font-bold transition hover:bg-emerald-600 hover:text-white active:scale-95 cursor-pointer flex flex-col items-center justify-center min-h-[64px]";
        btn.innerHTML = `<span class="text-xs text-slate-400">Door</span><span class="text-base">${subDoor}</span>`;
        grid.appendChild(btn);
      });
    }

    function recordLock(subDoor) {
      const nameInput = document.getElementById('user-name');
      const personName = nameInput.value.trim();

      // Require Name Validation
      if (!personName) {
        showError("⚠️ Please enter your name before logging a door lock!");
        nameInput.classList.add('border-rose-500', 'bg-rose-950/30');
        nameInput.focus();
        return;
      }

      // Reset Input Highlight & Error Box if Valid
      hideError();
      nameInput.classList.remove('border-rose-500', 'bg-rose-950/30');

      const historyRef = db.ref(`history/${activeTerminal}`);
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const isoDate = now.toISOString().split('T')[0];

      historyRef.push({
        door: subDoor,
        status: "LOCKED",
        timestamp: timeStr,
        date: isoDate,
        user: personName
      }).catch(err => showError("Write Error: " + err.message));
    }

    function fetchHistoryForSelectedDate() {
      const selectedDate = document.getElementById('history-date').value;
      const historyLog = document.getElementById('history-log');

      db.ref(`history/${activeTerminal}`)
        .orderByChild('date')
        .equalTo(selectedDate)
        .on('value', snapshot => {
          historyLog.innerHTML = "";
          currentFetchedLogs = [];

          snapshot.forEach(child => {
            currentFetchedLogs.unshift(child.val());
          });

          if (currentFetchedLogs.length === 0) {
            historyLog.innerHTML = `<div class="text-slate-500 italic">No door lock records found for ${selectedDate}.</div>`;
            return;
          }

          currentFetchedLogs.forEach(item => {
            historyLog.innerHTML += `
              <div class="flex justify-between items-center py-2 px-3 bg-slate-800/40 rounded-lg border border-slate-800">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-200">Door ${item.door}</span>
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800">
                    LOCKED
                  </span>
                  <span class="text-slate-400 text-[11px]">by <b>${item.user}</b></span>
                </div>
                <span class="text-slate-500">${item.timestamp}</span>
              </div>
            `;
          });
        }, err => showError("Read Error: " + err.message));
    }

    function exportToCSV() {
      if (currentFetchedLogs.length === 0) {
        alert("No records available to export for this date.");
        return;
      }

      const selectedDate = document.getElementById('history-date').value;
      const termName = activeTerminal === 'T2' ? "Terminal 2" : "Terminal 3";

      let csvContent = "data:text/csv;charset=utf-8,Terminal,Door,Status,Logged By,Date,Time\n";

      currentFetchedLogs.forEach(row => {
        const line = `"${termName}","Door ${row.door}","${row.status}","${row.user}","${row.date}","${row.timestamp}"`;
        csvContent += line + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Door_Log_${activeTerminal}_${selectedDate}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function hideError() {
      const box = document.getElementById('error-box');
      box.classList.add('hidden');
    }

    // Initialize View
    renderGrid();
    fetchHistoryForSelectedDate();
  </script>
</body>
</html>
