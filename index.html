<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Door Status Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <h1 class="text-xl font-bold text-center text-emerald-400 mb-2">🚪 Door Status Tracker</h1>
    <p class="text-xs text-slate-400 text-center uppercase tracking-wider mb-6">Tap a door button to lock / unlock:</p>
    
    <!-- Buttons -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button id="btn-Terminal 2" onclick="toggleDoor('Terminal 2')" class="p-4 rounded-xl bg-slate-800 text-slate-300 font-bold transition hover:opacity-80 active:scale-95 cursor-pointer">
        Terminal 2
      </button>
      <button id="btn-Terminal 3" onclick="toggleDoor('Terminal 3')" class="p-4 rounded-xl bg-slate-800 text-slate-300 font-bold transition hover:opacity-80 active:scale-95 cursor-pointer">
        Terminal 3
      </button>
    </div>

    <!-- Status Output -->
    <div class="border-t border-slate-800 pt-4">
      <div class="text-sm font-semibold text-slate-300 mb-3">📋 Real-Time Status Log</div>
      <div id="status-log" class="space-y-2 text-sm text-slate-400">Loading live data...</div>
    </div>

    <!-- Live Error Box -->
    <div id="error-box" class="mt-4 p-3 bg-red-950/80 border border-red-800 text-red-300 text-xs rounded-lg hidden"></div>
  </div>

  <script>
    // Your exact Firebase project keys
    const firebaseConfig = {
      apiKey: "AIzaSyBQ5_TI3e84CM0IKsOZIcqZM-MAv92jN6U",
      authDomain: "door-check-78157.firebaseapp.com",
      projectId: "door-check-78157",
      storageBucket: "door-check-78157.firebasestorage.app",
      messagingSenderId: "210863643705",
      databaseURL: "https://door-check-78157-default-rtdb.asia-southeast1.firebasedatabase.app/",
      appId: "1:210863643705:web:ce56f4c4ae9576ca00c1e8",
      measurementId: "G-C08XS1REV8"
    };

    // Initialize Firebase
    try {
      firebase.initializeApp(firebaseConfig);
    } catch (e) {
      showError("Firebase setup failed: " + e.message);
    }

    const db = firebase.database();

    // Toggle Door Status
    function toggleDoor(doorName) {
      const doorRef = db.ref('doors/' + doorName);
      doorRef.once('value').then(snapshot => {
        const currentStatus = snapshot.val()?.status;
        const nextStatus = (currentStatus === "LOCKED") ? "UNLOCKED" : "LOCKED";
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        return doorRef.set({ status: nextStatus, updatedAt: now });
      }).catch(err => showError("Click write error: " + err.message));
    }

    // Read Data in Real-Time
    db.ref('doors').on('value', snapshot => {
      const data = snapshot.val() || {};
      const logEl = document.getElementById('status-log');
      logEl.innerHTML = "";

      ["Terminal 2", "Terminal 3"].forEach(door => {
        const info = data[door] || { status: "UNLOCKED", updatedAt: "Not checked yet" };
        const btn = document.getElementById(`btn-${door}`);

        if (btn) {
          if (info.status === "LOCKED") {
            btn.innerText = door + "\n(LOCKED)";
            btn.className = "p-4 rounded-xl bg-emerald-600 text-white font-bold transition hover:opacity-90 active:scale-95 cursor-pointer shadow-lg shadow-emerald-900/30";
          } else {
            btn.innerText = door + "\n(UNLOCKED)";
            btn.className = "p-4 rounded-xl bg-slate-800 text-slate-300 font-bold transition hover:opacity-80 active:scale-95 cursor-pointer";
          }
        }

        logEl.innerHTML += `
          <div class="flex justify-between items-center py-2 px-3 bg-slate-800/40 rounded-lg border border-slate-800">
            <span class="font-medium text-slate-200">${door}: <b class="${info.status === 'LOCKED' ? 'text-emerald-400' : 'text-rose-400'}">${info.status}</b></span>
            <span class="text-xs text-slate-500">${info.updatedAt}</span>
          </div>`;
      });
    }, error => {
      showError("Permission denied: Check your Firebase Realtime Database Rules tab!");
    });

    function showError(msg) {
      const errorBox = document.getElementById('error-box');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
